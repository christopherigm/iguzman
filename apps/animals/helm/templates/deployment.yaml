apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "animals.fullname" . }}
  labels:
    {{- include "animals.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "animals.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "animals.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.videoScratch.enabled }}
      # An emptyDir arrives root-owned, and this container runs as uid 1001, so
      # without an fsGroup for the kubelet to chown the volume to, every chunk
      # write fails with EACCES. See the Dockerfile's /scratch note.
      securityContext:
        fsGroup: 1001
      {{- end }}
      {{- if .Values.nodeAffinity.enabled }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- toYaml .Values.nodeAffinity.nodeNames | nindent 22 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{- if or .Values.env .Values.envFromSecret }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.envFromSecret }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startupProbe.httpGet.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.probes.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessProbe.httpGet.path }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: {{ .Values.probes.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.probes.livenessProbe.failureThreshold }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.videoScratch.enabled }}
          volumeMounts:
            - name: video-scratch
              mountPath: {{ .Values.videoScratch.mountPath }}
          {{- end }}
      {{- if .Values.videoScratch.enabled }}
      volumes:
        - name: video-scratch
          emptyDir:
            # ⚠ Exceeding this **evicts the pod** rather than failing the write -
            # which takes the public site down briefly and kills every other
            # in-flight transcode, not just the offender. The budget is
            # (MAX_VIDEO_UPLOAD_MB x MAX_CONCURRENT_UPLOADS) plus the output, so
            # raising either of those without raising this is how that happens.
            sizeLimit: {{ .Values.videoScratch.sizeLimit }}
      {{- end }}
