# ─────────────────────────────────────────────────────────────
# Animals Api Application - Helm Values
# ─────────────────────────────────────────────────────────────

revisionHistoryLimit: 2
replicaCount: 1

# ─── Container image ────────────────────────────────────────
image:
  # Overridden at deploy time from DOCKER_REGISTRY (.env) → ${DOCKER_REGISTRY}/animals-api
  repository: animals-api
  tag: 'latest'
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ─── Name overrides ─────────────────────────────────────────
nameOverride: ''
fullnameOverride: ''

# ─── Service ────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# ─── Ingress ────────────────────────────────────────────────
ingress:
  enabled: true
  className: 'nginx'
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    # Two endpoints send a large multipart body straight through nginx, and its
    # default 1 MB cap would 413 both long before Django saw them:
    #
    #   * a sighting video (POST /api/journal/sightings/<pk>/media/video/) -
    #     keep this comfortably above MAX_VIDEO_UPLOAD_MB (200 MB), since
    #     multipart adds framing on top of the file itself;
    #   * a backup restore (POST /api/backups/restore/) - the whole site as a
    #     zip, media included.
    #
    # ⚠ The restore is the one with no ceiling of its own: nothing in Django
    # caps an archive's size, so this annotation IS the limit, and a journal
    # whose photographs outgrow it fails with an opaque 413 rather than a
    # readable message. Raise it (or set '0' for unlimited, as website-api does)
    # before the archive gets there - `pnpm helm` and a rollout, no code change.
    #
    # The default 60s read timeout would also cut either one off on a slow
    # uplink; both build and restore are synchronous, hence 600 to match
    # GUNICORN_TIMEOUT below.
    nginx.ingress.kubernetes.io/proxy-body-size: '256m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
  hosts:
    - host: animals-api.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: animals-api-tls
      hosts:
        - animals-api.iguzman.com.mx

# ─── Environment variables ──────────────────────────────────
# Non-secret vars not present in env.example / the k8s secret.
env:
  EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS: '24'
  GUNICORN_WORKERS: '3'
  # Largest video a sighting may carry. Must stay under the ingress
  # proxy-body-size above, which refuses a request before Django sees it.
  MAX_VIDEO_UPLOAD_MB: '200'
  # A 200 MB upload on a slow connection outlasts the 120s default and would be
  # killed mid-write, leaving a partial object in the bucket.
  GUNICORN_TIMEOUT: '600'
  # Cache API responses in Redis. Stated explicitly rather than left to its
  # default (which is derived from DEBUG, a key that comes from the secret) so
  # the public journal cannot end up serving every request uncached because of
  # how one secret was filled in. Invalidation is signal-driven - see
  # core/cache.py and each app's signals.py.
  API_CACHE_ENABLED: 'True'

# Load all env.example variables from the pre-existing secret.
# Keys in the secret match env.example names exactly.
#
# Media storage is Cloudflare R2 and nothing else - the pod has no volume. All
# five vars must be in the secret before the first deploy:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME,
#   R2_PUBLIC_DOMAIN (default: r2.iguzman.com.mx)
# Set them with `pnpm secrets`.
#
# The AI authoring endpoints (/api/ai/*) read GROQ_API_KEY, OPENROUTER_API_KEY
# and SCRAPER_API_KEY from this same bundle. They are optional: with no LLM key
# those four staff-only endpoints answer 503 and nothing else in the API is
# affected, and with no SCRAPER_API_KEY research falls back to the model's own
# knowledge. Same rule as the R2 vars - do NOT add them to `env:` above, even as
# empty placeholders, or the empty string shadows the secret.
#
# ⚠ Do NOT add any R2_* key to `env:` above, not even as an empty placeholder.
# `env` beats `envFrom`, and the template renders every key of `env:` including
# empty-valued ones - so `R2_ACCOUNT_ID: ''` would reach the pod as a real empty
# string, shadow the secret and silently turn R2 off, throwing uploads away.
envFrom:
  - secretRef:
      name: animals-api-secrets

# ─── Health probes ──────────────────────────────────────────
probes:
  startupProbe:
    httpGet:
      path: /admin/
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: /admin/
      port: 8000
    periodSeconds: 10
    failureThreshold: 3

# ─── Node affinity ──────────────────────────────────────────
nodeAffinity:
  enabled: false
  nodeNames: []

# ─── Resources ──────────────────────────────────────────────
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
