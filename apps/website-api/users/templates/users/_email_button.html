{% comment %}Email-safe CTA button. Expects: url, label, primary_color.{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px auto;">
  <tr>
    <td align="center" style="border-radius:8px; background-color:{{ primary_color|default:'#2196f3' }};">
      <a href="{{ url }}" target="_blank" style="display:inline-block; padding:14px 32px; font-family:Arial,Helvetica,sans-serif; font-size:16px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;">{{ label }}</a>
    </td>
  </tr>
</table>
