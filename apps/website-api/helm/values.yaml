# ─────────────────────────────────────────────────────────────
# Website API (Django) - Helm Values
# ─────────────────────────────────────────────────────────────

# -- Number of old ReplicaSets to keep for rollbacks (default: 2)
revisionHistoryLimit: 2

# -- Number of pod replicas
#
# Two, not one, so that a restart is a degraded moment rather than an outage.
# At one replica every liveness restart took the whole API down - that is what
# the flood of 502s on /api/system/ was during the August 2026 restarts - and the
# pod then came back with a cold cache into the same traffic that had just
# overwhelmed it. Nothing here holds local state (media is in R2), so replicas are
# free to scale; the backup/restore endpoints are synchronous but self-contained
# per request, so either pod can serve one.
replicaCount: 2

# ─── Container image ────────────────────────────────────────
image:
  repository: christopherguzman/website-api # registry/image (no tag)
  tag: 'latest' # overrides Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: my-registry-secret

# ─── Name overrides ─────────────────────────────────────────
nameOverride: ''
fullnameOverride: ''

# ─── Service ────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80 # port exposed by the Service
  targetPort: 8000 # port the container listens on (gunicorn)

# ─── Ingress ────────────────────────────────────────────────
ingress:
  enabled: true
  className: 'nginx'
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    # Restoring a site uploads a whole backup archive (data + every media file)
    # in one multipart request. ingress-nginx defaults to a 1m body limit, which
    # would 413 anything but the smallest site - and the browser reports that as
    # a bare network failure, with nothing in the API logs to explain it.
    # `0` disables the limit; the upload is admin-only and spooled to disk.
    nginx.ingress.kubernetes.io/proxy-body-size: '0'
    # A full-catalog backup or restore can run well past the 60s default while
    # it copies media, and a timeout mid-restore is exactly when the operator
    # most needs the request to finish.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
  hosts:
    - host: website-api.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: website-api-tls
      hosts:
        - website-api.iguzman.com.mx

# ─── Secrets ────────────────────────────────────────────────
# Loads every validly-named key of `website-api-secrets` as an env var - this is
# how GROQ_API_KEY / OPENROUTER_API_KEY reach Django.
#
# ⚠ This Secret also still holds a stale SCREAMING_SNAKE copy of an old env.example
# (DEBUG=True, ALLOWED_HOSTS=*, plus a SECRET_KEY and REDIS_PASSWORD that do NOT
# match the live kebab-case keys below). Those stale copies are inert ONLY because
# the `env:` block below names the same variables and `env` beats `envFrom`.
# Do NOT "de-duplicate" by deleting entries from `env:` - that would hand production
# DEBUG=True, ALLOWED_HOSTS=* and a rotated SECRET_KEY (logging every user out).
# Prune the stale keys from the Secret first; see apps/website-api/CLAUDE.md.
envFromSecretBundle: website-api-secrets

# ─── Environment variables ──────────────────────────────────
# Plain environment variables injected into the container.
# These deliberately override their stale namesakes in the Secret (see above).
env:
  DJANGO_SETTINGS_MODULE: 'website_api.settings'
  # ── Database ──────────────────────────────────────────────
  DB_HOST: 'postgres.website.svc.cluster.local'
  DB_PORT: '5432'
  DB_NAME: 'postgres'
  DB_USER: 'postgres'
  # ── Redis ──────────────────────────────────────────────────
  REDIS_URL: 'redis://redis.website.svc.cluster.local:6379/0'
  # ── Email ──────────────────────────────────────────────────
  EMAIL_HOST: 'smtp.ionos.com'
  EMAIL_PORT: '587'
  EMAIL_USE_TLS: 'True'
  FRONTEND_URL: 'https://website.iguzman.com.mx'
  # ── Optional overrides ────────────────────────────────────
  # SECRET_KEY: 'change-me-in-production'
  DEBUG: 'False' # set to 'True' for debugging, 'False' for production
  ALLOWED_HOSTS: 'website-api.iguzman.com.mx,website.iguzman.com.mx,bdrone.com.mx,elpanbueno.com,supertortaselchino.iguzman.com.mx,santofishrestaurant.iguzman.com.mx,cafedealtura.iguzman.com.mx,tamaratours.iguzman.com.mx,piccolopizzas.iguzman.com.mx,lacocinaderosalinda.iguzman.com.mx,localhost,127.0.0.1'
  CSRF_TRUSTED_ORIGINS: 'https://website-api.iguzman.com.mx,https://website.iguzman.com.mx,https://bdrone.com.mx,https://elpanbueno.com,https://supertortaselchino.iguzman.com.mx,https://santofishrestaurant.iguzman.com.mx,https://cafedealtura.iguzman.com.mx,https://tamaratours.iguzman.com.mx,https://piccolopizzas.iguzman.com.mx,https://lacocinaderosalinda.iguzman.com.mx'
  CORS_ALLOWED_ORIGINS: 'https://website.iguzman.com.mx,https://bdrone.com.mx,https://elpanbueno.com,https://supertortaselchino.iguzman.com.mx,https://santofishrestaurant.iguzman.com.mx,https://cafedealtura.iguzman.com.mx,https://tamaratours.iguzman.com.mx,https://piccolopizzas.iguzman.com.mx,https://lacocinaderosalinda.iguzman.com.mx'
  EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS: '24'
  # ── LLM (Groq primary, OpenRouter fallback) ───────────────
  GROQ_MODEL: 'openai/gpt-oss-120b'
  OPENROUTER_MODEL: 'meta-llama/llama-3.3-70b-instruct'
  LLM_REQUEST_TIMEOUT: '20'
  # ── Media storage (Cloudflare R2) ─────────────────────────
  # ⚠ Every R2_* variable is deliberately ABSENT from this block. All five are
  # keyed by their real env var names in the website-api-secrets Secret, so
  # `envFromSecretBundle` above delivers them; add or change them with
  # `pnpm secrets`:
  #   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
  #   R2_BUCKET_NAME, R2_PUBLIC_DOMAIN
  #
  # Do NOT re-add them here "for documentation". `env` beats `envFrom`, and the
  # template renders every key in this map including empty-valued ones - so a
  # placeholder `R2_ACCOUNT_ID: ''` reaches the pod as a real empty string and
  # SHADOWS the Secret. That is not a subtle degradation: R2_ACCOUNT_ID is the
  # single switch for the whole media stack (settings.py), so an empty one
  # silently turns R2 off entirely, no matter what the Secret holds - and with
  # the hostPath volume gone there is nowhere durable for the uploads to land.

# Sensitive values whose Secret key is kebab-case, and so cannot come from the
# bundle above (the kubelet skips keys that are not valid env var names). These are
# the values production has always run on - they intentionally shadow the stale
# SCREAMING_SNAKE copies of SECRET_KEY / REDIS_PASSWORD in the same Secret.
envFromSecret:
  - name: DB_PASSWORD
    secretName: website-api-secrets
    secretKey: db-password
  - name: SECRET_KEY
    secretName: website-api-secrets
    secretKey: secret-key
  # Uncomment if Redis auth is enabled (see packages/charts/redis auth.password).
  - name: REDIS_PASSWORD
    secretName: website-api-secrets
    secretKey: redis-password
  - name: EMAIL_HOST_USER
    secretName: website-api-secrets
    secretKey: email-host-user
  - name: EMAIL_HOST_PASSWORD
    secretName: website-api-secrets
    secretKey: email-host-password
  # GROQ_API_KEY / OPENROUTER_API_KEY are not listed here: they are keyed by their
  # real env var names in the Secret, so the bundle above delivers them.

# ─── Health probes ──────────────────────────────────────────
#
# ⚠ These probes were what kept "crashing" this API, and the shape below is the
# fix. They used to point at `/admin/` with no `timeoutSeconds`, which means the
# Kubernetes default of **1 second** - and `/admin/` is a real Django view that
# redirects to `/admin/login/` and reads the session store (Redis) and the
# database. So a slow *dependency*, or any burst that pushed one request past a
# second three times in a row, made the kubelet SIGTERM a perfectly healthy pod.
# The signature was a container exiting 0 with no traceback and no OOM.
#
# Three rules now hold, and none of them should be quietly relaxed:
#   1. Liveness asks only "is this process alive?" - `/healthz/` touches no
#      dependency, because restarting Django has never once fixed Redis.
#   2. Readiness is what is allowed to care about Postgres and Redis. It only
#      removes the pod from the Service and recovers on its own.
#   3. Every probe states its own `timeoutSeconds`. Leaving it out is how the
#      1-second default got in here unnoticed in the first place.
probes:
  # Boot: migrate + collectstatic run before gunicorn binds, so allow real time.
  startupProbe:
    httpGet:
      path: /healthz/
      port: 8000
      httpHeaders:
        - name: Host
          value: 127.0.0.1
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30 # ~150 s for first boot

  # Liveness: restart only a process that is genuinely wedged. 5s × 5 failures
  # over 50s is deliberately forgiving - a restart costs a cold cache and, at one
  # replica, an outage, so it must be the last resort rather than the first.
  livenessProbe:
    httpGet:
      path: /healthz/
      port: 8000
      httpHeaders:
        - name: Host
          value: 127.0.0.1
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

  # Readiness: this is the one that reacts to load and to a sick dependency, by
  # taking the pod out of rotation instead of killing it.
  readinessProbe:
    httpGet:
      path: /readyz/
      port: 8000
      httpHeaders:
        - name: Host
          value: 127.0.0.1
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

# ─── Node affinity (schedule on specific nodes) ─────────────
nodeAffinity:
  enabled: false
  # List of node names where the pods should be scheduled.
  nodeNames: []
  # - node-1
  # - node-2

# ─── Media storage ──────────────────────────────────────────
# There is no volume and no static-file sidecar here on purpose. Media lives in
# Cloudflare R2 (the R2_* keys of the Secret) and is served straight from the
# CDN, so the pod is stateless: it never holds a file a rollout could lose, and
# it never serves one. The hostPath volume on /shared-master and the nginx
# sidecar that published it under /media/ were removed once every site's files
# were confirmed in the bucket.

# ─── Resources ──────────────────────────────────────────────
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  # limits:
  #   cpu: 500m
  #   memory: 4Gi
