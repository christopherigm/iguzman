# ─────────────────────────────────────────────────────────────
# Website API (Django) - Helm Values
# ─────────────────────────────────────────────────────────────

# -- Number of old ReplicaSets to keep for rollbacks (default: 2)
revisionHistoryLimit: 2

# -- Number of pod replicas
replicaCount: 1

# ─── Container image ────────────────────────────────────────
image:
  repository: christopherguzman/website-api # registry/image (no tag)
  tag: 'latest' # overrides Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: my-registry-secret

# ─── Name overrides ─────────────────────────────────────────
nameOverride: ''
fullnameOverride: ''

# ─── Service ────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80 # port exposed by the Service
  targetPort: 8000 # port the container listens on (gunicorn)

# ─── Ingress ────────────────────────────────────────────────
ingress:
  enabled: true
  className: 'nginx'
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
  hosts:
    - host: website-api.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: website-api-tls
      hosts:
        - website-api.iguzman.com.mx

# ─── Secrets ────────────────────────────────────────────────
# Loads every validly-named key of `website-api-secrets` as an env var - this is
# how GROQ_API_KEY / OPENROUTER_API_KEY reach Django.
#
# ⚠ This Secret also still holds a stale SCREAMING_SNAKE copy of an old env.example
# (DEBUG=True, ALLOWED_HOSTS=*, plus a SECRET_KEY and REDIS_PASSWORD that do NOT
# match the live kebab-case keys below). Those stale copies are inert ONLY because
# the `env:` block below names the same variables and `env` beats `envFrom`.
# Do NOT "de-duplicate" by deleting entries from `env:` - that would hand production
# DEBUG=True, ALLOWED_HOSTS=* and a rotated SECRET_KEY (logging every user out).
# Prune the stale keys from the Secret first; see apps/website-api/CLAUDE.md.
envFromSecretBundle: website-api-secrets

# ─── Environment variables ──────────────────────────────────
# Plain environment variables injected into the container.
# These deliberately override their stale namesakes in the Secret (see above).
env:
  DJANGO_SETTINGS_MODULE: 'website_api.settings'
  MEDIA_ROOT: '/app/media'
  # ── Database ──────────────────────────────────────────────
  DB_HOST: 'postgres.website.svc.cluster.local'
  DB_PORT: '5432'
  DB_NAME: 'postgres'
  DB_USER: 'postgres'
  # ── Redis ──────────────────────────────────────────────────
  REDIS_URL: 'redis://redis.website.svc.cluster.local:6379/0'
  # ── Email ──────────────────────────────────────────────────
  EMAIL_HOST: 'smtp.ionos.com'
  EMAIL_PORT: '587'
  EMAIL_USE_TLS: 'True'
  FRONTEND_URL: 'https://website.iguzman.com.mx'
  # ── Optional overrides ────────────────────────────────────
  # SECRET_KEY: 'change-me-in-production'
  DEBUG: 'False' # set to 'True' for debugging, 'False' for production
  ALLOWED_HOSTS: 'website-api.iguzman.com.mx,website.iguzman.com.mx,bdrone.com.mx,elpanbueno.com,cafedealtura.iguzman.com.mx,supertortaselchino.iguzman.com.mx,localhost,127.0.0.1'
  CSRF_TRUSTED_ORIGINS: 'https://website-api.iguzman.com.mx,https://website.iguzman.com.mx,https://bdrone.com.mx,https://elpanbueno.com,https://cafedealtura.iguzman.com.mx,https://supertortaselchino.iguzman.com.mx'
  CORS_ALLOWED_ORIGINS: 'https://website.iguzman.com.mx,https://bdrone.com.mx,https://elpanbueno.com,https://cafedealtura.iguzman.com.mx,https://supertortaselchino.iguzman.com.mx'
  EMAIL_VERIFICATION_TOKEN_EXPIRY_HOURS: '24'
  # ── LLM (Groq primary, OpenRouter fallback) ───────────────
  GROQ_MODEL: 'openai/gpt-oss-120b'
  OPENROUTER_MODEL: 'meta-llama/llama-3.3-70b-instruct'
  LLM_REQUEST_TIMEOUT: '20'

# Sensitive values whose Secret key is kebab-case, and so cannot come from the
# bundle above (the kubelet skips keys that are not valid env var names). These are
# the values production has always run on - they intentionally shadow the stale
# SCREAMING_SNAKE copies of SECRET_KEY / REDIS_PASSWORD in the same Secret.
envFromSecret:
  - name: DB_PASSWORD
    secretName: website-api-secrets
    secretKey: db-password
  - name: SECRET_KEY
    secretName: website-api-secrets
    secretKey: secret-key
  # Uncomment if Redis auth is enabled (see packages/charts/redis auth.password).
  - name: REDIS_PASSWORD
    secretName: website-api-secrets
    secretKey: redis-password
  - name: EMAIL_HOST_USER
    secretName: website-api-secrets
    secretKey: email-host-user
  - name: EMAIL_HOST_PASSWORD
    secretName: website-api-secrets
    secretKey: email-host-password
  # GROQ_API_KEY / OPENROUTER_API_KEY are not listed here: they are keyed by their
  # real env var names in the Secret, so the bundle above delivers them.

# ─── Host-path volume (media storage) ───────────────────────
hostPathVolume:
  enabled: true
  volumeMountPath: /shared-master # base path on the host node
  mountPath: /app/media # path inside each container

# ─── Health probes ──────────────────────────────────────────
probes:
  startupProbe:
    httpGet:
      path: /admin/
      port: 8000
      httpHeaders:
        - name: Host
          value: 127.0.0.1
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 30 # allow up to ~150 s for first boot

  livenessProbe:
    httpGet:
      path: /admin/
      port: 8000
      httpHeaders:
        - name: Host
          value: 127.0.0.1
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3

# ─── Node affinity (schedule on specific nodes) ─────────────
nodeAffinity:
  enabled: false
  # List of node names where the pods should be scheduled.
  nodeNames: []
  # - node-1
  # - node-2

# ─── Nginx sidecar (serves media files) ─────────────────────
# High-performance static-file server that shares the same volume.
nginx:
  enabled: true
  image:
    repository: nginx
    tag: 'alpine'
    pullPolicy: IfNotPresent
  port: 8080 # port the nginx container listens on
  servicePort: 8080 # port exposed by the Service for nginx
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ─── Resources ──────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
