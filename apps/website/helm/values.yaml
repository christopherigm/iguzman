# ─────────────────────────────────────────────────────────────
# Website Application - Helm Values
# ─────────────────────────────────────────────────────────────

# -- Number of old ReplicaSets to keep for rollbacks (default: 2)
revisionHistoryLimit: 2 # how many old ReplicaSets to keep for rollbacks

# -- Number of pod replicas
replicaCount: 1

# ─── Container image ────────────────────────────────────────
image:
  # Overridden at deploy time from DOCKER_REGISTRY (.env) -> ${DOCKER_REGISTRY}/website
  repository: website
  tag: 'latest' # overrides Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: my-registry-secret

# ─── Name overrides ─────────────────────────────────────────
nameOverride: ''
fullnameOverride: ''

# ─── Service ────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80 # port exposed by the Service
  targetPort: 3000 # port the container listens on

# ─── Ingress ────────────────────────────────────────────────
ingress:
  enabled: true
  className: 'nginx' # MicroK8s uses the nginx ingress class
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
  hosts:
    - host: website.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
    - host: bdrone.com.mx
      paths:
        - path: /
          pathType: Prefix
    - host: panbueno.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
    - host: cafedealtura.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
    - host: supertortaselchino.iguzman.com.mx
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: website-tls
      hosts:
        - website.iguzman.com.mx
        - bdrone.com.mx
        - panbueno.iguzman.com.mx
        - cafedealtura.iguzman.com.mx
        - supertortaselchino.iguzman.com.mx

# ─── Environment variables ──────────────────────────────────
# Plain environment variables injected into the container.
env:
  NODE_ENV: 'production'
  NEXT_TELEMETRY_DISABLED: '1'
  # Server-side only (never NEXT_PUBLIC_): the browser talks to /api/* route
  # handlers, which reach Django from the server. Matches cinelog + edge-folio.
  API_URL: 'https://website-api.iguzman.com.mx'

# ─── Secrets ────────────────────────────────────────────────
# Every key in `website-secrets` is loaded as an env var (the Secret is keyed by
# real env var names, e.g. TAVILY_API_KEY). Add a key to the Secret and it lands in
# the pod with no chart change - but note the `env:` block above takes precedence,
# so anything named there wins over the Secret's copy.
#
# Create/update it with:
#   kubectl create secret generic website-secrets -n website \
#     --from-literal=TAVILY_API_KEY=... --dry-run=client -o yaml | kubectl apply -f -
envFromSecretBundle: website-secrets

# Individual keys from a Secret, for keys whose name is not a valid env var name.
# envFromSecret:
#   - name: DATABASE_URL
#     secretName: website-secrets
#     secretKey: database-url

# ─── Shared storage (ReadWriteMany) ─────────────────────────
sharedStorage:
  enabled: true
  storageClass: '' # leave empty for the cluster default
  accessModes:
    - ReadWriteMany
  size: 1Gi
  mountPath: /app/shared # path inside each container

# ─── Health probes (file-based in shared storage) ───────────
probes:
  # File that both probes check for existence.
  healthFile: /app/shared/.healthy

  startupProbe:
    exec:
      command: ['test', '-f', '/app/shared/.healthy']
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30 # allow up to ~150 s for first boot

  livenessProbe:
    exec:
      command: ['test', '-f', '/app/shared/.healthy']
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3

# ─── Node affinity (schedule on specific nodes) ─────────────
nodeAffinity:
  enabled: false
  # List of node names where the pods should be scheduled.
  nodeNames: []
  # - node-1
  # - node-2
  # - node-3

# ─── Resources ──────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
