{{- if .Values.rbac.create }}
{{- /*
  Garage's Kubernetes peer discovery stores each node as a
  `garagenodes.deuxfleurs.fr` custom resource. With skip_crd=false it also
  creates the CRD itself on first start, which needs cluster-scoped access to
  customresourcedefinitions — hence a ClusterRole rather than a namespaced Role.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "garage.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
rules:
  - apiGroups: ['apiextensions.k8s.io']
    resources: ['customresourcedefinitions']
    verbs: ['get', 'list', 'watch', 'create']
  - apiGroups: ['deuxfleurs.fr']
    resources: ['garagenodes']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "garage.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "garage.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "garage.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
