{{- if not .Values.garage.existingSecret }}
{{- $name := printf "%s-secrets" (include "garage.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := (and $existing $existing.data) | default dict }}
{{- /* rpc_secret must be a 32-byte hex string and MUST persist across upgrades */}}
{{- $rpc := .Values.garage.rpcSecret }}
{{- if and (not $rpc) (hasKey $existingData "GARAGE_RPC_SECRET") }}{{ $rpc = index $existingData "GARAGE_RPC_SECRET" | b64dec }}{{ end }}
{{- if not $rpc }}{{ $rpc = randAlphaNum 64 | sha256sum }}{{ end }}
{{- $admin := .Values.garage.adminToken }}
{{- if and (not $admin) (hasKey $existingData "GARAGE_ADMIN_TOKEN") }}{{ $admin = index $existingData "GARAGE_ADMIN_TOKEN" | b64dec }}{{ end }}
{{- if not $admin }}{{ $admin = randAlphaNum 32 }}{{ end }}
{{- $metrics := .Values.garage.metricsToken }}
{{- if and (not $metrics) (hasKey $existingData "GARAGE_METRICS_TOKEN") }}{{ $metrics = index $existingData "GARAGE_METRICS_TOKEN" | b64dec }}{{ end }}
{{- if not $metrics }}{{ $metrics = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
type: Opaque
stringData:
  GARAGE_RPC_SECRET: {{ $rpc | quote }}
  GARAGE_ADMIN_TOKEN: {{ $admin | quote }}
  GARAGE_METRICS_TOKEN: {{ $metrics | quote }}
{{- end }}
